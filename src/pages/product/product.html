<section>
    <a id="back" href="/">← Volver a la tienda</a>

    <article id="detail" hidden>
        <div id="image-container">
            <span id="discount"></span>
            <img id="img" alt="">
        </div>

        <div id="info">
            <span id="category"></span>
            <h1 id="name"></h1>

            <div id="prices">
                <span id="price"></span>
                <span id="discount-price"></span>
                <span id="unit"></span>
            </div>

            <p id="description"></p>

            <span id="stock"></span>

            <div id="actions">
                <label id="quantity-label">
                    Cantidad
                    <input id="quantity" type="number" min="1" step="1" value="1">
                </label>
                <primary-button id="add">Añadir al carrito de compras</primary-button>
            </div>
        </div>
    </article>

    <p id="not-found" hidden>No encontramos este producto. <a href="/">Volver al inicio</a></p>
</section>
